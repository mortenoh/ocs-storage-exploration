[project]
name = "ocs-storage-exploration"
version = "0.1.0"
description = "Prototype of a unified raster and vector storage abstraction for the Open Climate Service"
readme = "README.md"
authors = [
    { name = "Morten Hansen", email = "morten@winterop.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "storage",
    "icechunk",
    "geozarr",
    "geoparquet",
    "obstore",
    "climate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.121",
    "geojson-pydantic>=2.1",
    "geopandas>=1.1",
    "h5netcdf[h5py]>=1.8",
    "icechunk>=2.2,<3",
    "numpy>=2.2",
    "obstore>=0.11",
    "pandas>=2.3,<3",
    "pluginkit>=0.5.1",
    "pyarrow>=19",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "pyproj>=3.7",
    "pystac>=1.10",
    "rioxarray>=0.23",
    "shapely>=2.1",
    "uvicorn[standard]>=0.41",
    "xarray>=2026.7",
    "zarr>=3.3,<4",
]

[project.urls]
Homepage = "https://github.com/mortenoh/ocs-storage-exploration"
Repository = "https://github.com/mortenoh/ocs-storage-exploration"
Issues = "https://github.com/mortenoh/ocs-storage-exploration/issues"
Documentation = "https://mortenoh.github.io/ocs-storage-exploration"

[project.scripts]
ocs-storage-exploration = "ocs_storage_exploration.__main__:main"
ocs-storage-exploration-demo = "ocs_storage_exploration.demo:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.13",
    "httpx>=0.28",
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
    "mypy>=1.20",
    "pandas-stubs>=2.3,<3",
    "pyright>=1.1.411",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7",
    "ruff>=0.16",
    "types-shapely>=2.1,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# ruff formats Python code blocks inside Markdown; keep docs and AGENTS.md as written.
exclude = ["*.md"]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "__pycache__", "site"]
markers = [
    "s3: marks tests that need a live S3 endpoint (deselect with '-m \"not s3\"')",
    "samples: marks tests that need the files `make samples` downloads, and skip without them",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:Warning",
    # rioxarray builds its affine transforms with `*`; the warning is theirs, not ours.
    "ignore::PendingDeprecationWarning:rioxarray.*",
]
addopts = "-m 'not s3'"

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
relative_files = true
source = ["ocs_storage_exploration"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
# The example plugin under examples/ is not installed on purpose; its source tree is on the
# path so that the tests importing it still type check.
mypy_path = ["src", "examples/plugins/ocs-storage-null/src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# geopandas ships no py.typed marker, and neither does pyarrow as of 25.x.
module = ["geopandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["examples/plugins/ocs-storage-null/src"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false
