services:
  # The service on the filesystem backend. Started by `make docker-run-file`, which runs it in
  # the foreground so Ctrl-C stops the stack.
  api:
    profiles: ["file"]
    build: .
    container_name: ocs-storage-exploration-api
    # The image runs as an unprivileged user, and ./data is bind mounted from the host, so on Linux
    # the container has to run as the host user that owns it. `make docker-run-file` passes the
    # caller's ids; the fallback is the uid the image builds, which is what a bare `up` used before.
    user: "${OCS_UID:-999}:${OCS_GID:-999}"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OCS_STORAGE_BACKEND: ${OCS_STORAGE_BACKEND:-file}
      OCS_STORAGE_DATA_DIRECTORY: /app/data
      OCS_STORAGE_BASE_PREFIX: ${OCS_STORAGE_BASE_PREFIX:-ocs}
    volumes:
      - ./data:/app/data

  # The same image on the S3 backend, pointed at the rustfs service by its network alias.
  # It is published on 8001 so it never collides with `api` or with a local `make run`.
  api-s3:
    profiles: ["s3"]
    build: .
    container_name: ocs-storage-exploration-api-s3
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OCS_STORAGE_BACKEND: s3
      OCS_STORAGE_BASE_PREFIX: ${OCS_STORAGE_BASE_PREFIX:-ocs}
      OCS_STORAGE_S3__BUCKET: ${OCS_STORAGE_S3__BUCKET:-ocs-storage-exploration}
      OCS_STORAGE_S3__PREFIX: ${OCS_STORAGE_BASE_PREFIX:-ocs}
      OCS_STORAGE_S3__REGION: ${OCS_STORAGE_S3__REGION:-us-east-1}
      OCS_STORAGE_S3__ENDPOINT_URL: http://rustfs:9000
      OCS_STORAGE_S3__ALLOW_HTTP: "true"
      OCS_STORAGE_S3__FORCE_PATH_STYLE: "true"
      OCS_STORAGE_S3__ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      OCS_STORAGE_S3__SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    depends_on:
      rustfs:
        condition: service_healthy

  # The local S3-compatible endpoint. It is in the s3 and test profiles, and naming it on the
  # command line (`docker compose up -d --wait rustfs`, which is what `make test-s3` does)
  # enables its profile automatically, so the API containers stay down.
  rustfs:
    profiles: ["s3", "test"]
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: ocs-storage-exploration-rustfs
    entrypoint: |
      /bin/sh -c '
      mkdir -p /data/${OCS_STORAGE_S3__BUCKET:-ocs-storage-exploration};
      rustfs --access-key ${RUSTFS_ACCESS_KEY:-rustfsadmin} --secret-key ${RUSTFS_SECRET_KEY:-rustfsadmin} --console-enable /data
      '
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
