name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Run linting and type checking
        run: make lint

      - name: Verify the formatter changed nothing
        run: git diff --exit-code

      - name: Run tests with coverage
        run: make coverage

      - name: Build documentation
        run: make docs-build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # Optional: the s3-marked tests need a live endpoint. rustfs takes its credentials as command
  # line flags and pre-creates the bucket in its entrypoint, neither of which a GitHub Actions
  # service container can express, so the job starts it from compose.yml instead, exactly as
  # `make test-s3` does locally. It never fails the build.
  s3:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Run the s3-marked tests against rustfs
        run: make test-s3

      - name: Stop rustfs
        if: ${{ always() }}
        run: docker compose down --remove-orphans
